<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content"> 

            <button id="new-project-btn">New Project</button>
            <button id="new-task-btn" disabled>New task</button>
            <ul id="task-list"></ul>
    </div>

        <dialog id="add-project-dialog">
            <form id="add-project-form">
                <label for="project-name">Project Name:</label>
                <input type="text" id="project-name" name="project-name" required>
                <button type="submit">Add Project</button>
                <button type="button" id="cancel-project-btn">Cancel</button>
            </form>
        </dialog>

          <dialog id="add-task-dialog">
            <form id="add-task-form">
                <label for="task-title">Title:</label>
                <input type="text" id="task-title" name="task-title" required>

                 <label for="task-description">Description:</label>
                <textarea id="task-description" name="task-description"></textarea>

                 <label for="task-title">Due Date:</label>
                <input type="date" id="task-due-date" name="task-due-date" required>

                 <label for="task-title">Priority:</label>
                <select id="task-priority" name="task-priority" required>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                    </select>



                <button type="submit">Add task</button>
                <button type="button" id="cancel-task-btn">Cancel</button>
            </form>
        </dialog>
    

    
</body>
</html>
